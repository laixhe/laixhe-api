openapi: 3.0.0
info:
  title: API接口
  description: '用户认证与用户管理 API 服务。注册/登录成功后返回 JWT 令牌 (HS256 签名, 含 uid/exp/iat/nbf 声明), 过期时长由 JWT_EXPIRE_TIME 控制。受保护接口需在请求头携带 Authorization: Bearer <token>。'
  version: '1.0'
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: 注册
      description: 注册
      operationId: 48e49e48019e8b141753cb515a26100b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: 登录
      description: "登录\n\n封禁账号与密码错误返回同一提示, 避免暴露账号状态 (可被探测)。"
      operationId: 5db09a35f965c6ca7529ed3c3cae8e21
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: 刷新Jwt
      description: "刷新Jwt\n\n用户不存在或账号被封禁时返回 401 (与 Go 端一致)。"
      operationId: 05bd0482845348cafa4da9e4fb7d0ffb
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          BearerAuth: []
  /api/v1/health:
    get:
      tags:
        - Health
      summary: 健康检查
      description: "健康检查\n\n通过 SELECT 1 探测数据库连接, 正常返回 200 + 健康信息;\n数据库不可用时返回 503 + 统一错误格式, 便于负载均衡探活。"
      operationId: d88a3a13c7c8232c4f7ce153ff171edb
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 'Service Unavailable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/info:
    get:
      tags:
        - User
      summary: 获取用户信息
      description: '获取用户信息 (公开接口, 不受 JWT 保护)'
      operationId: 4c9f3e7bfd9c863f6ab4023493ef10fb
      parameters:
        -
          name: uid
          in: query
          description: 用户id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/list:
    get:
      tags:
        - User
      summary: 获取用户列表
      description: '获取用户列表 (公开接口, 不受 JWT 保护)'
      operationId: 60cbb4b1d54bc73bf717e2e55295d679
      parameters:
        -
          name: page
          in: query
          description: '分页-当前页(默认 1)'
          required: false
          schema:
            type: integer
        -
          name: page_size
          in: query
          description: '分页-每页数量(默认 12)'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/update:
    post:
      tags:
        - User
      summary: 更新用户信息
      description: '更新用户信息 (需要 JWT, Uid 由 JWT 提供)'
      operationId: aac6294085079e6659c990fadc85422b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          BearerAuth: []
components:
  schemas:
    AuthLoginRequest:
      description: 登录请求参数
      required:
        - email
        - password
      properties:
        email:
          description: 邮箱
          type: string
          example: user@example.com
        password:
          description: 密码
          type: string
          example: abc123
      type: object
    AuthRegisterRequest:
      description: 注册请求参数
      required:
        - nickname
        - email
        - password
      properties:
        nickname:
          description: 昵称
          type: string
          example: 张三
        email:
          description: 邮箱
          type: string
          example: user@example.com
        password:
          description: 密码
          type: string
          example: abc123
      type: object
    UserUpdateRequest:
      description: '修改用户信息请求参数 (Uid 由 JWT 提供)'
      required:
        - nickname
      properties:
        nickname:
          description: 昵称
          type: string
          example: 张三
        avatar_url:
          description: 头像地址
          type: string
          example: ''
      type: object
    AuthTokenResponse:
      description: 鉴权成功响应体
      required:
        - token
        - user
      properties:
        token:
          description: 'jwt token'
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: '#/components/schemas/User'
      type: object
    Error:
      description: 统一错误响应体
      required:
        - code
        - message
      properties:
        code:
          description: '错误码 (与 HTTP 状态码一致)'
          type: integer
          example: 422
        message:
          description: 错误描述
          type: string
          example: 参数错误
      type: object
    HealthResponse:
      description: 健康检查响应体
      required:
        - status
        - database
        - version
        - started_at
        - now
      properties:
        status:
          description: '服务状态 (固定 "ok")'
          type: string
          example: ok
        database:
          description: '数据库状态 (固定 "up")'
          type: string
          example: up
        version:
          description: 服务版本
          type: string
          example: 1.0.0
        started_at:
          description: '服务启动时间 (服务器本地时区)'
          type: string
          example: '2026-08-10 12:00:00'
        now:
          description: '当前时间 (服务器本地时区)'
          type: string
          example: '2026-08-10 12:00:00'
      type: object
    User:
      description: 用户信息
      required:
        - uid
        - type_id
        - account
        - mobile
        - email
        - nickname
        - avatar_url
        - sex
        - states
        - created_at
      properties:
        uid:
          description: 用户id
          type: integer
          example: 1
        type_id:
          description: '类型 1-普通用户'
          type: integer
          example: 1
          enum:
            - 1
        account:
          description: 账号
          type: string
          example: xid00000000000000000000
        mobile:
          description: 手机号
          type: string
          example: ''
        email:
          description: 邮箱
          type: string
          example: user@example.com
        nickname:
          description: 昵称
          type: string
          example: 张三
        avatar_url:
          description: 头像地址
          type: string
          example: ''
        sex:
          description: '性别 (0-未填写 1-男 2-女)'
          type: integer
          example: 1
          enum:
            - 0
            - 1
            - 2
        states:
          description: '状态 (0-禁用 1-正常)'
          type: integer
          example: 1
          enum:
            - 0
            - 1
        created_at:
          description: '创建时间, 格式 "Y-m-d H:i:s"'
          type: string
          example: '2026-08-10 12:00:00'
      type: object
    UserListResponse:
      description: 用户列表响应体
      required:
        - total
        - page
        - page_size
        - list
      properties:
        total:
          description: 总数
          type: integer
          example: 100
        page:
          description: 分页-当前页
          type: integer
          example: 1
        page_size:
          description: 分页-每页数量
          type: integer
          example: 12
        list:
          description: 列表
          type: array
          items:
            $ref: '#/components/schemas/User'
      type: object
  securitySchemes:
    BearerAuth:
      type: http
      description: '在请求头携带 Authorization: Bearer <token>'
      bearerFormat: JWT
      scheme: bearer
security:
  -
    BearerAuth: []
tags:
  -
    name: Auth
    description: Auth
  -
    name: Health
    description: Health
  -
    name: User
    description: User

