openapi: 3.1.0
info:
  title: API接口
  description: 用户认证与用户管理 API 服务
  license:
    name: ''
  version: '1.0'
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 登录
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: 刷新Jwt
      operationId: refresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: 注册
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/health:
    get:
      tags:
      - Health
      summary: 健康检查
      description: |-
        通过连接级 ping 探测数据库, 成功返回 200 + 健康信息。
        数据库不可用时返回 503 + 统一错误格式, 便于负载均衡探活。
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/info:
    get:
      tags:
      - User
      summary: 获取用户信息
      operationId: info
      parameters:
      - name: uid
        in: query
        description: 用户id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/list:
    get:
      tags:
      - User
      summary: 获取用户列表
      operationId: list
      parameters:
      - name: page
        in: query
        description: 分页-当前页(默认 1)
        required: false
        schema:
          type: integer
          format: int32
      - name: page_size
        in: query
        description: 分页-每页数量(默认 12)
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/update:
    post:
      tags:
      - User
      summary: 更新用户信息
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerAuth: []
components:
  schemas:
    AuthLoginRequest:
      type: object
      description: |-
        请求-登录

        字段缺省为空字符串 (对齐 Go: 未注册 validator, validate:"required" 不生效, 由业务校验兜底)
      required:
      - email
      - password
      properties:
        email:
          type: string
          description: 邮箱
        password:
          type: string
          description: 密码
    AuthRegisterRequest:
      type: object
      description: |-
        请求-注册

        字段缺省为空字符串 (对齐 Go: 未注册 validator, validate:"required" 不生效, 由业务校验兜底)
      required:
      - nickname
      - email
      - password
      properties:
        email:
          type: string
          description: 邮箱
        nickname:
          type: string
          description: 昵称
        password:
          type: string
          description: 密码
    AuthTokenResponse:
      type: object
      description: 响应-鉴权成功 (注册/登录/刷新共用, 与 PHP/TS 端 AuthTokenResponse 对齐)
      required:
      - token
      - user
      properties:
        token:
          type: string
          description: jwt token
        user:
          $ref: '#/components/schemas/User'
          description: 用户信息
    Error:
      type: object
      description: |-
        统一错误响应体 (与 PHP/TS 端 Error 及 Go core.Error 对齐)

        字段仅供 utoipa 生成文档 schema 使用, 无需在业务中读写
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: 错误码 (与 HTTP 状态码一致)
          minimum: 0
        message:
          type: string
          description: 错误描述
    HealthResponse:
      type: object
      description: 健康检查响应体
      required:
      - status
      - database
      - version
      - started_at
      - now
      properties:
        database:
          type: string
          description: 数据库状态 (固定 "up"; DB 异常不输出 down, 直接走 503 统一错误体)
        now:
          type: string
          description: 当前时间 (服务器本地时区, 格式 Y-m-d H:i:s)
        started_at:
          type: string
          description: 服务启动时间 (服务器本地时区, 格式 Y-m-d H:i:s, 与 Go/PHP 版一致)
        status:
          type: string
          description: 服务状态 (固定 "ok"; DB 异常不输出 degraded, 直接走 503 统一错误体)
        version:
          type: string
          description: 服务版本
    User:
      type: object
      description: 用户信息
      required:
      - uid
      - type_id
      - account
      - mobile
      - email
      - nickname
      - avatar_url
      - sex
      - states
      - created_at
      properties:
        account:
          type: string
          description: 账号
        avatar_url:
          type: string
          description: 头像地址
        created_at:
          type: string
          description: 创建时间
        email:
          type: string
          description: 邮箱
        mobile:
          type: string
          description: 手机号
        nickname:
          type: string
          description: 昵称
        sex:
          type: integer
          format: int32
          description: 性别 (0 - 未填写, 1 - 男, 2 - 女)
          enum:
          - 0
          - 1
          - 2
        states:
          type: integer
          format: int32
          description: 状态 (0 - 禁用, 1 - 正常)
          enum:
          - 0
          - 1
        type_id:
          type: integer
          format: int32
          description: 类型 (1 - 普通用户)
          enum:
          - 1
        uid:
          type: integer
          format: int32
          description: 用户id
    UserListResponse:
      type: object
      description: 响应-获取用户列表
      required:
      - total
      - page
      - page_size
      - list
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: 列表 (完整用户字段, 与 Go 端一致)
        page:
          type: integer
          format: int32
          description: 分页-当前页
        page_size:
          type: integer
          format: int32
          description: 分页-每页数量
        total:
          type: integer
          format: int32
          description: 总数
    UserUpdateRequest:
      type: object
      description: |-
        请求-更新用户信息 (Uid 由 JWT 提供, 禁止 body 传入; 对齐 Go 的 json:"-")

        nickname / avatar_url 缺省为空字符串 (对齐 Go: 未注册 validator, validate:"required" 不生效, 由业务校验兜底)
      required:
      - nickname
      properties:
        avatar_url:
          type: string
          description: 头像地址
        nickname:
          type: string
          description: 昵称
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '在请求头携带 Authorization: Bearer <token>'
security:
- BearerAuth: []
